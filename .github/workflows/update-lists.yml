name: update-lists

on:
  schedule:
    - cron: '17 */6 * * *'   # каждые 6 часов
  workflow_dispatch:         # и вручную кнопкой Run workflow

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build lists
        run: bash build.sh

      - name: Commit changes
        id: commit
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A release
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Списки не изменились"
          else
            git commit -m "update lists $(date -u +%Y-%m-%d_%H:%M)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          for f in geosite.dat geoip.dat vpn-domains.yaml vpn-ips.yaml vpn-domains.json vpn-ips.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/release/$f" > /dev/null || true
          done
